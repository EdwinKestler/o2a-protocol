<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img">
  <title>O2A technology stack</title>
  <desc>The proposed stack keeps custody and deterministic validation in the user client, uses Bitcoin and RGB as the required identity foundation, treats DNS, social, Pubky, and Nostr as adapters, and treats databases and object storage as replaceable services.</desc>
  <defs><filter id="shadow" x="-6%" y="-8%" width="116%" height="132%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#112840" flood-opacity="0.08"/></filter></defs>
  <rect width="1200" height="960" fill="#f6f8fb"/>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="48" y="52" fill="#1559e9" font-size="12" font-weight="700" letter-spacing="2.2">TECHNOLOGY STACK</text>
    <text x="48" y="90" fill="#142238" font-size="30" font-weight="700">Client-side by design, replaceable at the edges</text>
    <text x="48" y="118" fill="#536379" font-size="15">A proposed implementation boundary—not a running stack and not a final web-framework choice.</text>

    <g filter="url(#shadow)">
      <rect x="48" y="146" width="1104" height="154" rx="18" fill="#ffffff" stroke="#c8d8ec"/>
      <rect x="48" y="174" width="5" height="98" fill="#1559e9"/>
      <text x="76" y="178" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.3">01 / SELF-CUSTODIAL CLIENT</text>
      <rect x="76" y="198" width="252" height="74" rx="12" fill="#eef4fc"/><text x="94" y="226" fill="#142238" font-size="15" font-weight="700">Wallet UI · CLI · SDK</text><text x="94" y="250" fill="#536379" font-size="12">Create · recover · export · verify</text>
      <rect x="348" y="198" width="360" height="74" rx="12" fill="#eef4fc"/><text x="366" y="226" fill="#142238" font-size="15" font-weight="700">Encrypted local vault</text><text x="366" y="250" fill="#536379" font-size="12">Seed · keys · consignments · evidence · packages</text>
      <rect x="728" y="198" width="396" height="74" rx="12" fill="#112840"/><text x="746" y="226" fill="#ffffff" font-size="15" font-weight="700">Deterministic protocol core</text><text x="746" y="250" fill="#b7d3ee" font-size="12">Canonical codec · signatures · RGB · policy</text>
    </g>

    <text x="48" y="344" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.3">02 / REQUIRED IDENTITY FOUNDATION</text>
    <g filter="url(#shadow)">
      <g transform="translate(48 364)"><rect width="538" height="176" rx="18" fill="#112840"/><text x="24" y="38" fill="#a9edd6" font-size="11" font-weight="700" letter-spacing="1.2">RGB IDENTITY PROFILE</text><text x="24" y="76" fill="#ffffff" font-size="20" font-weight="700">Client-side state validation</text><text x="24" y="108" fill="#b7d3ee" font-size="13">Genesis · controller rotation · recovery-policy change</text><text x="24" y="132" fill="#b7d3ee" font-size="13">authorized recovery · custody transfer · revocation</text><text x="24" y="156" fill="#a9edd6" font-size="12">Consignments stay with interested parties</text></g>
      <g transform="translate(614 364)"><rect width="538" height="176" rx="18" fill="#ffffff" stroke="#1559e9" stroke-width="1.5"/><text x="24" y="38" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.2">BITCOIN DATA ACCESS</text><text x="24" y="76" fill="#142238" font-size="20" font-weight="700">Order, anchors, seals</text><text x="24" y="108" fill="#536379" font-size="13">Witnesses · commitments · confirmations · reorg rules</text><text x="24" y="132" fill="#536379" font-size="13">Full Bitcoin node or explicitly labeled light mode</text><text x="24" y="156" fill="#80521d" font-size="12">Bitcoin spending authorization remains separate</text></g>
    </g>

    <text x="48" y="584" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.3">03 / ADAPTERS AND SERVICES</text>
    <g filter="url(#shadow)">
      <g transform="translate(48 604)"><rect width="538" height="184" rx="18" fill="#ffffff" stroke="#dce3ed"/><text x="24" y="38" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.2">EVIDENCE + DISCOVERY ADAPTERS</text><text x="24" y="74" fill="#142238" font-size="17" font-weight="700">Bounded observations and package discovery</text><text x="24" y="105" fill="#536379" font-size="13">DNS · HTTPS · recognized social accounts</text><text x="24" y="129" fill="#536379" font-size="13">Pubky / PKARR · optional Nostr · direct wallet exchange</text><text x="24" y="160" fill="#80521d" font-size="12" font-weight="700">EVIDENCE OR TRANSPORT — NOT ROOT AUTHORITY</text></g>
      <g transform="translate(614 604)"><rect width="538" height="184" rx="18" fill="#ffffff" stroke="#dce3ed"/><text x="24" y="38" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.2">REPLACEABLE SERVICE LAYER</text><text x="24" y="74" fill="#142238" font-size="17" font-weight="700">Projection, cache, and replicated bytes</text><text x="24" y="105" fill="#536379" font-size="13">Protocol API · PostgreSQL / search projection</text><text x="24" y="129" fill="#536379" font-size="13">Redis disposable cache · object/package storage</text><text x="24" y="160" fill="#80521d" font-size="12" font-weight="700">REBUILDABLE — NEVER CONSENSUS</text></g>
    </g>

    <rect x="48" y="824" width="1104" height="88" rx="16" fill="#e7eef9" stroke="#c5d6f0"/>
    <text x="72" y="854" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.3">AUTHORITY CHECK</text>
    <text x="72" y="881" fill="#142238" font-size="14">Bitcoin orders and seals · RGB validates identity history · O2A signatures authorize typed objects · named policy evaluates real-world evidence.</text>
    <text x="48" y="940" fill="#536379" font-size="12">No database, API, relay, indexer, homeserver, or UI framework can replace the BIP340 root or validate an RGB transition by itself.</text>
  </g>
</svg>
