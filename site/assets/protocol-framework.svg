<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img">
  <title>O2A protocol framework and authority boundaries</title>
  <desc>The framework separates owner-controlled keys, Bitcoin and RGB identity state, signed evidence and content-addressed proof packages, independent verification, and replaceable discovery, registries, and applications.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#112840" flood-opacity="0.08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2L8 5L0 8.8" fill="none" stroke="#1559e9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="dotted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2L8 5L0 8.8" fill="none" stroke="#8b9db4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="920" fill="#f6f8fb"/>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="48" y="52" fill="#1559e9" font-size="12" font-weight="700" letter-spacing="2.2">PROTOCOL FRAMEWORK</text>
    <text x="48" y="90" fill="#142238" font-size="30" font-weight="700">Five boundaries, no hidden central authority</text>
    <text x="48" y="118" fill="#536379" font-size="15">Each boundary proves something different. No service inherits another layer's authority.</text>

    <g filter="url(#shadow)">
      <g transform="translate(48 158)"><rect width="204" height="418" rx="18" fill="#ffffff" stroke="#dce3ed"/><text x="20" y="36" fill="#1559e9" font-size="11" font-weight="700">01 / CUSTODY</text><circle cx="102" cy="104" r="43" fill="#112840"/><circle cx="102" cy="104" r="24" fill="none" stroke="#a9edd6" stroke-width="2"/><path d="M102 88v32M86 104h32" stroke="#a9edd6" stroke-width="2"/><text x="20" y="176" fill="#142238" font-size="17" font-weight="700">Owner wallet / node</text><text x="20" y="207" fill="#536379" font-size="12">Seed + local backup</text><text x="20" y="230" fill="#536379" font-size="12">Immutable BIP340 root</text><text x="20" y="253" fill="#536379" font-size="12">Rotatable controllers</text><text x="20" y="276" fill="#536379" font-size="12">Recovery + revocation</text><rect x="20" y="310" width="164" height="74" rx="10" fill="#fff4e8"/><text x="32" y="338" fill="#80521d" font-size="10" font-weight="700">SEPARATE PURPOSES</text><text x="32" y="361" fill="#536379" font-size="11">identity · spending</text><text x="32" y="378" fill="#536379" font-size="11">discovery · payment</text></g>
      <g transform="translate(272 158)"><rect width="204" height="418" rx="18" fill="#112840"/><text x="20" y="36" fill="#a9edd6" font-size="11" font-weight="700">02 / STATE</text><text x="20" y="78" fill="#ffffff" font-size="17" font-weight="700">Bitcoin</text><text x="20" y="104" fill="#b7d3ee" font-size="12">Order · anchors · seals</text><path d="M20 130H184" stroke="#40556b"/><text x="20" y="171" fill="#ffffff" font-size="17" font-weight="700">RGB</text><text x="20" y="197" fill="#b7d3ee" font-size="12">Identity schema + history</text><text x="20" y="220" fill="#b7d3ee" font-size="12">Client-side validation</text><rect x="20" y="266" width="164" height="114" rx="10" fill="#1d3a58"/><text x="32" y="293" fill="#a9edd6" font-size="10" font-weight="700">ESTABLISHES</text><text x="32" y="316" fill="#ffffff" font-size="11">ordered lifecycle</text><text x="32" y="337" fill="#ffffff" font-size="11">valid transitions</text><text x="32" y="358" fill="#b7d3ee" font-size="10">not real-world truth</text></g>
      <g transform="translate(496 158)"><rect width="204" height="418" rx="18" fill="#ffffff" stroke="#dce3ed"/><text x="20" y="36" fill="#1559e9" font-size="11" font-weight="700">03 / EVIDENCE</text><text x="20" y="78" fill="#142238" font-size="17" font-weight="700">Typed signatures</text><text x="20" y="104" fill="#536379" font-size="12">Purpose-specific domains</text><text x="20" y="127" fill="#536379" font-size="12">Claims · attestations</text><text x="20" y="150" fill="#536379" font-size="12">Challenges · manifests</text><path d="M20 176H184" stroke="#dce3ed"/><text x="20" y="214" fill="#142238" font-size="17" font-weight="700">Observations</text><text x="20" y="240" fill="#536379" font-size="12">DNS · HTTPS · social</text><rect x="20" y="278" width="164" height="102" rx="10" fill="#e9f1ff"/><text x="32" y="305" fill="#1559e9" font-size="10" font-weight="700">NAME CLAIMS</text><text x="32" y="328" fill="#142238" font-size="11">non-exclusive</text><text x="32" y="349" fill="#536379" font-size="10">conflicts stay visible</text></g>
      <g transform="translate(720 158)"><rect width="204" height="418" rx="18" fill="#ffffff" stroke="#dce3ed"/><text x="20" y="36" fill="#1559e9" font-size="11" font-weight="700">04 / PROOF</text><text x="20" y="78" fill="#142238" font-size="17" font-weight="700">Public package</text><text x="20" y="104" fill="#536379" font-size="12">Content-addressed manifest</text><text x="20" y="127" fill="#536379" font-size="12">Public identity history</text><text x="20" y="150" fill="#536379" font-size="12">Bitcoin proofs + evidence</text><text x="20" y="173" fill="#536379" font-size="12">Policy + context</text><rect x="20" y="215" width="164" height="75" rx="10" fill="#f0faf6"/><text x="32" y="243" fill="#17624c" font-size="10" font-weight="700">PORTABLE</text><text x="32" y="266" fill="#536379" font-size="11">direct or replicated</text><rect x="20" y="310" width="164" height="70" rx="10" fill="#fff4e8"/><text x="32" y="338" fill="#80521d" font-size="10" font-weight="700">LOCATOR ≠ AUTHORITY</text><text x="32" y="361" fill="#536379" font-size="10">verify bytes after fetch</text></g>
      <g transform="translate(944 158)"><rect width="208" height="418" rx="18" fill="#112840"/><text x="20" y="36" fill="#a9edd6" font-size="11" font-weight="700">05 / VERIFY</text><text x="20" y="78" fill="#ffffff" font-size="17" font-weight="700">Independent wallet</text><text x="20" y="106" fill="#b7d3ee" font-size="12">1 Package hash</text><text x="20" y="129" fill="#b7d3ee" font-size="12">2 Bitcoin proofs</text><text x="20" y="152" fill="#b7d3ee" font-size="12">3 RGB history</text><text x="20" y="175" fill="#b7d3ee" font-size="12">4 Key + domain</text><text x="20" y="198" fill="#b7d3ee" font-size="12">5 Evidence boundary</text><text x="20" y="221" fill="#b7d3ee" font-size="12">6 Named policy</text><rect x="20" y="264" width="168" height="116" rx="10" fill="#1d3a58"/><text x="32" y="292" fill="#a9edd6" font-size="10" font-weight="700">EXPLAINED RESULT</text><text x="32" y="319" fill="#ffffff" font-size="12">same inputs</text><text x="32" y="341" fill="#ffffff" font-size="12">same output</text><text x="32" y="363" fill="#b7d3ee" font-size="10">or incomplete / invalid</text></g>
    </g>
    <g fill="none" stroke="#1559e9" stroke-width="1.6" marker-end="url(#arrow)"><path d="M252 367H264"/><path d="M476 367H488"/><path d="M700 367H712"/><path d="M924 367H936"/></g>

    <rect x="48" y="618" width="1104" height="108" rx="16" fill="#e7eef9" stroke="#c5d6f0"/>
    <text x="72" y="650" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.3">REPLACEABLE DISCOVERY + VIEWS</text>
    <text x="72" y="680" fill="#142238" font-size="14">Direct exchange · HTTPS · Pubky / PKARR · optional Nostr → artist / venue / promoter / event / album registries → applications</text>
    <text x="72" y="705" fill="#536379" font-size="12">These components find, cache, project, and present validated packages. They do not mint identity or decide consensus.</text>
    <path d="M822 618V585" fill="none" stroke="#8b9db4" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#dotted)"/>

    <text x="48" y="770" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.3">AUTHORITY LEGEND</text>
    <g font-size="12">
      <rect x="48" y="792" width="258" height="78" rx="12" fill="#ffffff" stroke="#dce3ed"/><text x="66" y="820" fill="#142238" font-weight="700">Bitcoin</text><text x="66" y="844" fill="#536379">order + seals</text>
      <rect x="330" y="792" width="258" height="78" rx="12" fill="#ffffff" stroke="#dce3ed"/><text x="348" y="820" fill="#142238" font-weight="700">RGB</text><text x="348" y="844" fill="#536379">identity-state validity</text>
      <rect x="612" y="792" width="258" height="78" rx="12" fill="#ffffff" stroke="#dce3ed"/><text x="630" y="820" fill="#142238" font-weight="700">O2A signature</text><text x="630" y="844" fill="#536379">typed authorship + integrity</text>
      <rect x="894" y="792" width="258" height="78" rx="12" fill="#ffffff" stroke="#dce3ed"/><text x="912" y="820" fill="#142238" font-weight="700">Named policy</text><text x="912" y="844" fill="#536379">evidence interpretation</text>
    </g>
    <text x="48" y="902" fill="#536379" font-size="12">No privileged validator set votes on who is the real artist, and chronology does not grant exclusive ownership of a spoken name.</text>
  </g>
</svg>
