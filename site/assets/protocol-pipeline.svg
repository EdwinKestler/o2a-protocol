<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img">
  <title>O2A protocol and release pipeline</title>
  <desc>The proposed delivery pipeline moves from a frozen specification through deterministic Bitcoin and RGB regtest conformance, a self-custodial wallet, public discovery and testnet interoperability, a reviewed mainnet identity release, and later applications.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#112840" flood-opacity="0.08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2L8 5L0 8.8" fill="none" stroke="#1559e9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="920" fill="#f6f8fb"/>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="48" y="52" fill="#1559e9" font-size="12" font-weight="700" letter-spacing="2.2">PROTOCOL + RELEASE PIPELINE</text>
    <text x="48" y="90" fill="#142238" font-size="30" font-weight="700">Close one evidence gate before opening the next</text>
    <text x="48" y="118" fill="#536379" font-size="15">The project is still in Phase 0. These are proposed gates, not deployed environments.</text>

    <g filter="url(#shadow)">
      <g transform="translate(48 158)"><rect width="344" height="190" rx="18" fill="#e9f1ff" stroke="#1559e9" stroke-width="1.5"/><text x="22" y="36" fill="#1559e9" font-size="11" font-weight="700">PHASE 0 · NOW</text><text x="22" y="72" fill="#142238" font-size="19" font-weight="700">Freeze the specification</text><text x="22" y="104" fill="#536379" font-size="13">Canonical encoding + signing domains</text><text x="22" y="128" fill="#536379" font-size="13">RGB stack / commitment method + vectors</text><text x="22" y="152" fill="#536379" font-size="13">Source-license decision before code</text></g>
      <g transform="translate(428 158)"><rect width="344" height="190" rx="18" fill="#ffffff" stroke="#dce3ed"/><text x="22" y="36" fill="#1559e9" font-size="11" font-weight="700">PHASE 1</text><text x="22" y="72" fill="#142238" font-size="19" font-weight="700">Prove the deterministic core</text><text x="22" y="104" fill="#536379" font-size="13">Bitcoin/RGB regtest lifecycle</text><text x="22" y="128" fill="#536379" font-size="13">Positive + adversarial conformance vectors</text><text x="22" y="152" fill="#536379" font-size="13">Independent verifiers return same result</text></g>
      <g transform="translate(808 158)"><rect width="344" height="190" rx="18" fill="#ffffff" stroke="#dce3ed"/><text x="22" y="36" fill="#1559e9" font-size="11" font-weight="700">PHASE 2</text><text x="22" y="72" fill="#142238" font-size="19" font-weight="700">Build the wallet / node</text><text x="22" y="104" fill="#536379" font-size="13">Local custody + backup / recovery</text><text x="22" y="128" fill="#536379" font-size="13">Proof export / import + fail-closed checks</text><text x="22" y="152" fill="#536379" font-size="13">Full-node and explicit light modes</text></g>

      <g transform="translate(48 410)"><rect width="344" height="190" rx="18" fill="#ffffff" stroke="#dce3ed"/><text x="22" y="36" fill="#1559e9" font-size="11" font-weight="700">PHASE 3</text><text x="22" y="72" fill="#142238" font-size="19" font-weight="700">Discovery + public testnet</text><text x="22" y="104" fill="#536379" font-size="13">DNS/social observations + Pubky/Nostr</text><text x="22" y="128" fill="#536379" font-size="13">Competing claims + registry rebuild</text><text x="22" y="152" fill="#536379" font-size="13">External wallet interoperability</text></g>
      <g transform="translate(428 410)"><rect width="344" height="190" rx="18" fill="#112840"/><text x="22" y="36" fill="#a9edd6" font-size="11" font-weight="700">PHASE 4</text><text x="22" y="72" fill="#ffffff" font-size="19" font-weight="700">Beta → mainnet identity v1</text><text x="22" y="104" fill="#b7d3ee" font-size="13">Version-pinned wallet · CLI · SDK</text><text x="22" y="128" fill="#b7d3ee" font-size="13">Security review + reproducible releases</text><text x="22" y="152" fill="#a9edd6" font-size="13">Identity · evidence · verification</text></g>
      <g transform="translate(808 410)"><rect width="344" height="190" rx="18" fill="#ffffff" stroke="#dce3ed"/><text x="22" y="36" fill="#1559e9" font-size="11" font-weight="700">PHASE 5+</text><text x="22" y="72" fill="#142238" font-size="19" font-weight="700">Applications + research</text><text x="22" y="104" fill="#536379" font-size="13">Paid-use · GatePass · SplitNight</text><text x="22" y="128" fill="#536379" font-size="13">Additional RGB rights contracts</text><text x="22" y="152" fill="#536379" font-size="13">Federation + reputation research</text></g>
    </g>
    <g fill="none" stroke="#1559e9" stroke-width="1.6" marker-end="url(#arrow)"><path d="M392 253H420"/><path d="M772 253H800"/><path d="M980 348V382H220V402"/><path d="M392 505H420"/><path d="M772 505H800"/></g>
    <g font-size="10" font-weight="700" text-anchor="middle"><rect x="397" y="232" width="18" height="42" rx="9" fill="#f6f8fb"/><text x="406" y="248" fill="#1559e9" transform="rotate(-90 406 248)">SPEC</text><rect x="777" y="218" width="18" height="70" rx="9" fill="#f6f8fb"/><text x="786" y="267" fill="#1559e9" transform="rotate(-90 786 267)">VECTORS</text><rect x="397" y="477" width="18" height="56" rx="9" fill="#f6f8fb"/><text x="406" y="522" fill="#1559e9" transform="rotate(-90 406 522)">INTEROP</text><rect x="777" y="470" width="18" height="70" rx="9" fill="#f6f8fb"/><text x="786" y="529" fill="#1559e9" transform="rotate(-90 786 529)">IDENTITY V1</text></g>

    <text x="48" y="652" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.4">ARTIFACT PROMOTION</text>
    <rect x="48" y="672" width="1104" height="104" rx="16" fill="#ffffff" stroke="#dce3ed"/>
    <g font-size="14" font-weight="700" fill="#142238" text-anchor="middle"><text x="150" y="718">Reviewed commit</text><text x="374" y="718">Reproducible build</text><text x="600" y="718">Signed artifact</text><text x="826" y="718">Dev + testnet</text><text x="1050" y="718">Mainnet release</text></g>
    <g font-size="11" fill="#536379" text-anchor="middle"><text x="150" y="742">exact source SHA</text><text x="374" y="742">pinned toolchain</text><text x="600" y="742">provenance + SBOM</text><text x="826" y="742">same bytes</text><text x="1050" y="742">no second build</text></g>
    <g fill="none" stroke="#1559e9" stroke-width="1.6" marker-end="url(#arrow)"><path d="M246 724H278"/><path d="M470 724H502"/><path d="M696 724H728"/><path d="M922 724H954"/></g>

    <rect x="48" y="808" width="1104" height="72" rx="16" fill="#fff4e8" stroke="#e6c69f"/>
    <text x="72" y="838" fill="#80521d" font-size="11" font-weight="700" letter-spacing="1.2">STATUS BOUNDARY</text>
    <text x="72" y="862" fill="#142238" font-size="13">A design, simulation, local test, merged commit, deployment, live verification, and public release are separate states.</text>
  </g>
</svg>
