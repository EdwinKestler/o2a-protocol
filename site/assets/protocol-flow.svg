<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <title>O2A public proof protocol flow</title>
  <desc>An owner wallet creates a Bitcoin-rooted RGB identity, evolves controller state, signs purpose-specific evidence, exports a content-addressed proof package, and sends or publishes it for two independent wallets to verify.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#112840" flood-opacity="0.08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1.2L8 5L0 8.8" fill="none" stroke="#1559e9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1200" height="900" fill="#f6f8fb"/>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="48" y="52" fill="#1559e9" font-size="12" font-weight="700" letter-spacing="2.2">PROTOCOL FLOW</text>
    <text x="48" y="90" fill="#142238" font-size="30" font-weight="700">From self-custody to independent verification</text>
    <text x="48" y="118" fill="#536379" font-size="15">The package carries the public history and evidence. The host or locator never becomes authority.</text>

    <rect x="48" y="148" width="1104" height="332" rx="20" fill="#eaf0f9" stroke="#c8d8ec"/>
    <text x="72" y="180" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.5">OWNER WALLET / NODE</text>
    <g filter="url(#shadow)">
      <g transform="translate(72 202)"><rect width="238" height="230" rx="16" fill="#ffffff" stroke="#dce3ed"/><circle cx="28" cy="31" r="14" fill="#1559e9"/><text x="28" y="36" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">01</text><text x="50" y="35" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1">CREATE</text><text x="20" y="79" fill="#142238" font-size="18" font-weight="700">Root the EntityID</text><text x="20" y="110" fill="#536379" font-size="13">Immutable BIP340 root</text><text x="20" y="132" fill="#536379" font-size="13">RGB genesis + Bitcoin anchor</text><text x="20" y="171" fill="#80521d" font-size="12" font-weight="700">KEY SEPARATION</text><text x="20" y="194" fill="#536379" font-size="12">Identity key ≠ spending key</text></g>
      <g transform="translate(338 202)"><rect width="238" height="230" rx="16" fill="#ffffff" stroke="#dce3ed"/><circle cx="28" cy="31" r="14" fill="#1559e9"/><text x="28" y="36" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">02</text><text x="50" y="35" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1">EVOLVE</text><text x="20" y="79" fill="#142238" font-size="18" font-weight="700">Update control</text><text x="20" y="110" fill="#536379" font-size="13">Rotate controller keys</text><text x="20" y="132" fill="#536379" font-size="13">Change recovery rules</text><text x="20" y="154" fill="#536379" font-size="13">Recover or revoke</text><text x="20" y="194" fill="#536379" font-size="12">RGB validates the lifecycle</text></g>
      <g transform="translate(604 202)"><rect width="238" height="230" rx="16" fill="#ffffff" stroke="#dce3ed"/><circle cx="28" cy="31" r="14" fill="#1559e9"/><text x="28" y="36" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">03</text><text x="50" y="35" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1">ATTEST</text><text x="20" y="79" fill="#142238" font-size="18" font-weight="700">Sign typed evidence</text><text x="20" y="110" fill="#536379" font-size="13">Name + DNS/social control</text><text x="20" y="132" fill="#536379" font-size="13">Relationships + challenges</text><text x="20" y="154" fill="#536379" font-size="13">Event / album manifests</text><text x="20" y="194" fill="#536379" font-size="12">One signing domain per purpose</text></g>
      <g transform="translate(870 202)"><rect width="258" height="230" rx="16" fill="#112840"/><circle cx="28" cy="31" r="14" fill="#a9edd6"/><text x="28" y="36" text-anchor="middle" fill="#112840" font-size="11" font-weight="700">04</text><text x="50" y="35" fill="#a9edd6" font-size="11" font-weight="700" letter-spacing="1">PACKAGE</text><text x="20" y="79" fill="#ffffff" font-size="18" font-weight="700">Export public proof</text><text x="20" y="110" fill="#b7d3ee" font-size="13">Identity-history shard</text><text x="20" y="132" fill="#b7d3ee" font-size="13">Bitcoin proofs + evidence</text><text x="20" y="154" fill="#b7d3ee" font-size="13">Policy + explicit context</text><text x="20" y="194" fill="#a9edd6" font-size="12">Immutable package hash</text></g>
    </g>
    <g fill="none" stroke="#1559e9" stroke-width="1.6" marker-end="url(#arrow)"><path d="M310 317H330"/><path d="M576 317H596"/><path d="M842 317H862"/></g>

    <rect x="48" y="510" width="1104" height="86" rx="16" fill="#ffffff" stroke="#dce3ed"/>
    <text x="72" y="540" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.3">05 / TRANSFER OR DISCOVER</text>
    <text x="72" y="568" fill="#142238" font-size="15">Direct wallet exchange · HTTPS · Pubky / PKARR · optional Nostr pointer</text>
    <rect x="842" y="531" width="286" height="40" rx="20" fill="#fff4e8" stroke="#e6c69f"/>
    <text x="985" y="556" text-anchor="middle" fill="#80521d" font-size="12" font-weight="700">LOCATOR ≠ AUTHORITY</text>

    <text x="48" y="638" fill="#1559e9" font-size="11" font-weight="700" letter-spacing="1.4">06 / VERIFY INDEPENDENTLY</text>
    <g filter="url(#shadow)">
      <g transform="translate(48 660)"><rect width="306" height="156" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="22" y="36" fill="#1559e9" font-size="11" font-weight="700">WALLET A</text><text x="22" y="70" fill="#142238" font-size="16" font-weight="700">Validate every boundary</text><text x="22" y="100" fill="#536379" font-size="13">Package hash · Bitcoin · RGB</text><text x="22" y="123" fill="#536379" font-size="13">keys · signatures · domains · policy</text></g>
      <g transform="translate(380 660)"><rect width="306" height="156" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="22" y="36" fill="#1559e9" font-size="11" font-weight="700">WALLET B</text><text x="22" y="70" fill="#142238" font-size="16" font-weight="700">Validate every boundary</text><text x="22" y="100" fill="#536379" font-size="13">Package hash · Bitcoin · RGB</text><text x="22" y="123" fill="#536379" font-size="13">keys · signatures · domains · policy</text></g>
      <g transform="translate(712 660)"><rect width="440" height="156" rx="16" fill="#112840"/><text x="24" y="36" fill="#a9edd6" font-size="11" font-weight="700">DETERMINISM INVARIANT</text><text x="24" y="75" fill="#ffffff" font-size="20" font-weight="700">Same bounded inputs → same result</text><text x="24" y="107" fill="#b7d3ee" font-size="13">Conflicts and missing evidence remain visible.</text><text x="24" y="130" fill="#b7d3ee" font-size="13">A registry may present the result, never redefine it.</text></g>
    </g>
    <path d="M354 738H372" fill="none" stroke="#1559e9" stroke-width="1.6" marker-end="url(#arrow)"/>
    <path d="M686 738H704" fill="none" stroke="#1559e9" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="48" y="864" fill="#536379" font-size="12">If required history is absent, a reference is unavailable, or a hash fails, the result is incomplete or invalid—not silently reconstructed.</text>
  </g>
</svg>
