[graph]
# Development-only crates are never built into or distributed with this
# standalone CC0 conformance checker.
exclude-dev = true

[advisories]
yanked = "deny"
# Maintainer decision 2026-09-24: paste is a compile-time-only proc macro
# with no runtime code path. Track replacement with pastey upstream.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# Licenses outside this routine allowlist are report-only findings. Record each
# one in docs/22-license-and-adoption-assessment.md with an assessment and an
# accepted or review-before-distribution status. GPL, AGPL, and SSPL require
# maintainer review before public distribution or mainnet release, but do not
# block development. MITNFA is not globally allowed; the register contains the
# scoped assessment for hex_lit 0.1.1 outside this checker graph.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
