[graph]
# Development-only crates are never built into or distributed with this
# standalone CC0 conformance checker.
exclude-dev = true

[advisories]
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "MIT", "CC0-1.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
